# Used only by the CI end-to-end test (docker-compose.ci.yml): the same routing idea as the real
# configuration, but everything is delivered to a webhook so no Telegram account is needed.
global:
  resolve_timeout: 5m
route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
receivers:
  - name: webhook
    webhook_configs:
      - url: http://webhook:8080/
        send_resolved: true
