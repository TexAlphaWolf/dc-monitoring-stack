# Alertmanager: groups alerts, silences duplicates and sends them to Telegram.
# The bot token and chat id are read from files (Docker secrets fed from .env), never from this file.
global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: telegram
  group_by: [alertname, host, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The heartbeat is never sent to a person.
    - receiver: "null"
      matchers: [alertname = "Watchdog"]
    # Critical problems repeat more often.
    - receiver: telegram
      matchers: [severity = "critical"]
      repeat_interval: 1h
    # Informational events (reboots) are sent once, without repetition.
    - receiver: telegram
      matchers: [severity = "info"]
      repeat_interval: 24h

inhibit_rules:
  # A critical alert hides the warning for the same thing.
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [alertname, instance]
  # A very soon certificate expiry hides the "soon" one.
  - source_matchers: [alertname = "TlsCertificateExpiresVerySoon"]
    target_matchers: [alertname = "TlsCertificateExpiresSoon"]
    equal: [instance]
  # A down host explains every other alert about it.
  - source_matchers: [alertname =~ "HostDown|WindowsHostDown"]
    target_matchers: [severity =~ "warning|info"]
    equal: [host]
  # Full disk (critical) makes the "will fill" prediction redundant.
  - source_matchers: [alertname = "HostDiskSpaceCritical"]
    target_matchers: [alertname =~ "HostDiskSpaceLow|HostDiskWillFillIn24Hours"]
    equal: [instance, mountpoint]

receivers:
  - name: "null"
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        parse_mode: HTML
        disable_notifications: false
        send_resolved: true
        message: '{{ template "telegram.message" . }}'
