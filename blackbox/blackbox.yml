modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      method: GET
      valid_status_codes: []          # any 2xx
      follow_redirects: true
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: false   # certificate errors are real failures
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
